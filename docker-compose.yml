version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: viet_heritagepedia_rabbitmq
    restart: always
    ports:
      - "5672:5672"    # AMQP protocol
      - "15672:15672"  # Management Dashboard UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RMQ_USER:-vietadmin}
      RABBITMQ_DEFAULT_PASS: ${RMQ_PASS:-VhpAdmin@2026!}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  redis:
    image: redis:7-alpine
    container_name: viet_heritagepedia_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    container_name: viet_heritagepedia_minio
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    volumes:
      - minio_data:/data

volumes:
  rabbitmq_data:
  redis_data:
  minio_data:
